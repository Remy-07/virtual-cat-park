<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <title>Illustration of a Maine Coon</title>
  <!-- bushy tail -->
  <path d="M112 136 C142 134 146 106 130 94" fill="none" stroke="#8A6440" stroke-width="20" stroke-linecap="round"/>
  <path d="M112 136 C142 134 146 106 130 94" fill="none" stroke="#A87C50" stroke-width="11" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="80" cy="118" rx="42" ry="32" fill="#A87C50"/>
  <!-- chest fur -->
  <ellipse cx="80" cy="130" rx="26" ry="22" fill="#E3D3BC"/>
  <!-- paws -->
  <ellipse cx="60" cy="145" rx="15" ry="8" fill="#E3D3BC"/>
  <ellipse cx="100" cy="145" rx="15" ry="8" fill="#E3D3BC"/>
  <!-- ears: tall with dark tufts -->
  <polygon points="48,52 40,14 74,40" fill="#A87C50"/>
  <polygon points="112,52 120,14 86,40" fill="#A87C50"/>
  <polygon points="53,46 48,24 68,41" fill="#E0AEB0"/>
  <polygon points="107,46 112,24 92,41" fill="#E0AEB0"/>
  <polygon points="40,15 33,5 47,13" fill="#6B4A2F"/>
  <polygon points="120,15 127,5 113,13" fill="#6B4A2F"/>
  <!-- head -->
  <ellipse cx="80" cy="66" rx="37" ry="34" fill="#A87C50"/>
  <!-- muzzle -->
  <ellipse cx="80" cy="82" rx="20" ry="14" fill="#E3D3BC"/>
  <!-- fur ruff under the chin -->
  <polygon points="56,93 62,105 68,93" fill="#A87C50"/>
  <polygon points="72,95 78,109 84,95" fill="#A87C50"/>
  <polygon points="88,93 94,105 100,93" fill="#A87C50"/>
  <!-- eyes: green -->
  <circle cx="66" cy="62" r="8" fill="#8FBF6B"/>
  <circle cx="94" cy="62" r="8" fill="#8FBF6B"/>
  <circle cx="66" cy="62" r="4" fill="#2A2A2A"/>
  <circle cx="94" cy="62" r="4" fill="#2A2A2A"/>
  <circle cx="68" cy="59" r="1.6" fill="#FFFFFF"/>
  <circle cx="96" cy="59" r="1.6" fill="#FFFFFF"/>
  <!-- nose -->
  <polygon points="80,76 76,82 84,82" fill="#D08E92"/>
  <!-- mouth -->
  <path d="M80 82 v4" stroke="#6B4A2F" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 86 q-7 6 -13 1" fill="none" stroke="#6B4A2F" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 86 q7 6 13 1" fill="none" stroke="#6B4A2F" stroke-width="2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M42 74 h-14 M42 80 h-16 M118 74 h14 M118 80 h16" stroke="#6B4A2F" stroke-width="1.6" stroke-linecap="round"/>
</svg>
