<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <title>Illustration of a British Shorthair</title>
  <!-- tail: short and thick, curled to the right -->
  <path d="M114 130 C132 130 136 116 128 106" fill="none" stroke="#7C8699" stroke-width="13" stroke-linecap="round"/>
  <!-- body: round and stocky -->
  <ellipse cx="80" cy="120" rx="42" ry="30" fill="#8A93A8"/>
  <ellipse cx="80" cy="126" rx="28" ry="20" fill="#B3BAC9"/>
  <!-- front paws -->
  <ellipse cx="62" cy="143" rx="14" ry="8" fill="#B3BAC9"/>
  <ellipse cx="98" cy="143" rx="14" ry="8" fill="#B3BAC9"/>
  <!-- ears: small and rounded -->
  <polygon points="50,48 44,22 72,38" fill="#8A93A8"/>
  <polygon points="110,48 116,22 88,38" fill="#8A93A8"/>
  <polygon points="55,44 51,30 66,39" fill="#D9A7AE"/>
  <polygon points="105,44 109,30 94,39" fill="#D9A7AE"/>
  <!-- head: wide and round -->
  <ellipse cx="80" cy="66" rx="36" ry="33" fill="#8A93A8"/>
  <!-- eyes: big and amber -->
  <circle cx="66" cy="62" r="8" fill="#F2C24C"/>
  <circle cx="94" cy="62" r="8" fill="#F2C24C"/>
  <circle cx="66" cy="62" r="4" fill="#2A2A2A"/>
  <circle cx="94" cy="62" r="4" fill="#2A2A2A"/>
  <circle cx="68" cy="59" r="1.6" fill="#FFFFFF"/>
  <circle cx="96" cy="59" r="1.6" fill="#FFFFFF"/>
  <!-- nose -->
  <polygon points="80,72 76,77 84,77" fill="#D9A7AE"/>
  <!-- mouth -->
  <path d="M80 77 v4" stroke="#5E6675" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 81 q-7 6 -13 1" fill="none" stroke="#5E6675" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 81 q7 6 13 1" fill="none" stroke="#5E6675" stroke-width="2" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M44 70 h-12 M44 76 h-14 M116 70 h12 M116 76 h14" stroke="#5E6675" stroke-width="1.6" stroke-linecap="round"/>
</svg>
